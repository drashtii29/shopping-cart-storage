<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drashti's Shopping Cart</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #ffd6e8, #ffeaf4);
    overflow-x: hidden;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    font-size: 28px;
    color: #d63384;
}

/* FLOATING BOWS */
.bows span {
    position: fixed;
    font-size: 28px;
    animation: float 10s linear infinite;
    opacity: 0.7;
}

.bows span:nth-child(1) { left: 5%; animation-delay: 0s; }
.bows span:nth-child(2) { left: 20%; animation-delay: 2s; }
.bows span:nth-child(3) { left: 40%; animation-delay: 4s; }
.bows span:nth-child(4) { left: 60%; animation-delay: 6s; }
.bows span:nth-child(5) { left: 80%; animation-delay: 8s; }

@keyframes float {
    0% { top: 100%; transform: rotate(0deg); }
    100% { top: -10%; transform: rotate(360deg); }
}

/* FORM */
.form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px;
    margin: 15px;
    background: rgba(255,255,255,0.8);
    border-radius: 15px;
}

.form input, .form button {
    padding: 10px;
    border-radius: 10px;
    border: none;
}

.form button {
    background: #ff69b4;
    color: white;
    cursor: pointer;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
    padding: 15px;
}

/* CARD */
.card {
    background: #fff0f6;
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 0 15px rgba(255,105,180,0.3);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 12px;
}

.card h3 {
    color: #c2185b;
}

.actions button {
    padding: 6px 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin-right: 5px;
}

.view {
    background: #ff85a2;
    color: white;
}

.delete {
    background: #ff4d6d;
    color: white;
}
</style>
</head>

<body>

<!-- FLOATING BOWS -->
<div class="bows">
    <span>🎀</span>
    <span>🎀</span>
    <span>🎀</span>
    <span>🎀</span>
    <span>🎀</span>
</div>

<header>
🎀 Drashti's Shopping Cart 🎀
</header>

<div class="form">
    <input id="name" placeholder="Product name">
    <input id="price" type="number" placeholder="Price">
    <input id="image" placeholder="Image URL">
    <input id="link" placeholder="Product link">
    <button onclick="addItem()">Add 🎀</button>
</div>

<div class="grid" id="grid"></div>

<script>

// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ---------------- ADD ----------------
async function addItem() {
    const name = document.getElementById("name").value.trim();
    const price = document.getElementById("price").value;
    const image = document.getElementById("image").value.trim();
    const link = document.getElementById("link").value.trim();

    if (!name || !price || !link) {
        alert("Please fill all fields 🎀");
        return;
    }

    await db.collection("cartItems").add({
        name,
        price,
        image: image || "https://via.placeholder.com/200",
        link,
        createdAt: Date.now()
    });

    clearForm();
    loadItems();
}

// ---------------- LOAD ----------------
async function loadItems() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    const snapshot = await db
        .collection("cartItems")
        .orderBy("createdAt", "desc")
        .get();

    snapshot.forEach(doc => {
        const item = doc.data();

        grid.innerHTML += `
        <div class="card">
            <img src="${item.image}">
            <h3>${item.name}</h3>
            <p>₹${item.price}</p>

            <div class="actions">
                <button class="view" onclick="window.open('${item.link}')">View</button>
                <button class="delete" onclick="deleteItem('${doc.id}')">Delete</button>
            </div>
        </div>
        `;
    });
}

// ---------------- DELETE ----------------
async function deleteItem(id) {
    await db.collection("cartItems").doc(id).delete();
    loadItems();
}

// ---------------- CLEAR ----------------
function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("image").value = "";
    document.getElementById("link").value = "";
}

// ---------------- START ----------------
loadItems();

</script>

</body>
</html>
