<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Drashti's Shopping Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Pacifico', cursive;
            background: #ffe6f0;
            /* soft pink static background */
        }

        /* Header */
        header {
            text-align: center;
            padding: 20px;
            color: #d63384;
            font-size: 28px;
        }

        /* Form */
        .form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            margin: 15px;
            background: white;
            border-radius: 12px;
        }

        .form input,
        .form button {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .form button {
            background: #ff69b4;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        /* Card */
        .card {
            background: #fff0f6;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card h3 {
            margin: 8px 0;
            color: #c2185b;
        }

        .actions button {
            padding: 6px 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 5px;
        }

        .view {
            background: #ff85a2;
            color: white;
        }

        .delete {
            background: #ff4d6d;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        🎀 Drashti's Shopping Cart 🎀
    </header>

    <div class="form">
        <input id="name" placeholder="Product name">
        <input id="price" type="number" placeholder="Price">
        <input id="image" placeholder="Image URL">
        <input id="link" placeholder="Product link">
        <button onclick="addItem()">Add 🎀</button>
    </div>

    <div class="grid" id="grid"></div>

    <script>

        let items = JSON.parse(localStorage.getItem("cartItems")) || [];

        function save() {
            localStorage.setItem("cartItems", JSON.stringify(items));
        }

        function addItem() {
            const name = document.getElementById("name").value.trim();
            const price = document.getElementById("price").value;
            const image = document.getElementById("image").value.trim();
            const link = document.getElementById("link").value.trim();

            if (!name || !price || !link) {
                alert("Please fill all fields 🎀");
                return;
            }

            items.push({
                name,
                price,
                image: image || "https://via.placeholder.com/200",
                link
            });

            save();
            render();
            clearForm();
        }

        function render() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";

            items.forEach((item, index) => {
                grid.innerHTML += `
        <div class="card">
            <img src="${item.image}">
            <h3>${item.name}</h3>
            <p>₹${item.price}</p>

            <div class="actions">
                <button class="view" onclick="window.open('${item.link}')">View</button>
                <button class="delete" onclick="deleteItem(${index})">Delete</button>
            </div>
        </div>
        `;
            });
        }

        function deleteItem(i) {
            items.splice(i, 1);
            save();
            render();
        }

        function clearForm() {
            document.getElementById("name").value = "";
            document.getElementById("price").value = "";
            document.getElementById("image").value = "";
            document.getElementById("link").value = "";
        }

        render();

    </script>

</body>

</html>
